<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ご予約</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --green: #06c755;
    --green-dark: #05a647;
    --ink: #1b2a22;
    --muted: #6b7a72;
    --line: #dfe6e2;
    --bg: #f3f6f4;
    --card: #ffffff;
    --err: #d93025;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 480px; margin: 0 auto; padding: 20px 16px calc(32px + env(safe-area-inset-bottom)); }
  h1 { font-size: 22px; margin: 4px 0 2px; }
  .sub { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 6px; }
  label:not(:first-child) { margin-top: 14px; }
  .hint { font-weight: 400; color: var(--muted); }
  #phoneBox { margin-top: 14px; }
  input, select {
    width: 100%;
    font-size: 16px; /* iOSの自動ズーム防止 */
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    color: var(--ink);
    appearance: none;
    -webkit-appearance: none;
  }
  select {
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 20px) 55%, calc(100% - 14px) 55%;
    background-size: 6px 6px, 6px 6px;
    background-repeat: no-repeat;
    padding-right: 36px;
  }
  input:focus, select:focus { outline: 2px solid var(--green); border-color: var(--green); }
  .summary { background: #e8f8ef; border: 1px solid #bfe9cf; }
  .summary .row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; padding: 3px 0; }
  .summary .row span:first-child { color: var(--muted); }
  .summary .price { font-size: 22px; font-weight: 700; color: var(--green-dark); }
  button {
    width: 100%;
    font-size: 17px;
    font-weight: 700;
    padding: 15px;
    border: 0;
    border-radius: 12px;
    background: var(--green);
    color: #fff;
  }
  button:disabled { background: #b7c9bf; }
  #error { color: var(--err); font-size: 14px; margin: 12px 2px 0; min-height: 1em; white-space: pre-wrap; }
  .notes { color: var(--muted); font-size: 12px; margin: 10px 2px 0; line-height: 1.6; }
  #done { text-align: center; }
  .check {
    width: 64px; height: 64px; margin: 8px auto 12px;
    border-radius: 50%; background: var(--green); color: #fff;
    font-size: 36px; line-height: 64px;
  }
  #done .card { text-align: left; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="formView">
    <h1>ご予約</h1>
    <p class="sub">ご希望の日時をお選びください</p>

    <form id="form" novalidate>
      <div class="card">
        <label for="name">お名前(本名)</label>
        <input id="name" type="text" autocomplete="name" maxlength="40" placeholder="例:山田 太郎">

        <div id="phoneBox" hidden>
          <label for="phone">お電話番号 <span class="hint">(初回のみ・ご連絡用)</span></label>
          <input id="phone" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="例:090-1234-5678">
        </div>
      </div>

      <div class="card">
        <label for="date">ご利用日</label>
        <input id="date" type="date">

        <label for="start">開始時刻 <span class="hint">(15分単位)</span></label>
        <select id="start" disabled></select>

        <label for="duration">ご利用時間 <span class="hint">(2時間〜・30分単位)</span></label>
        <select id="duration" disabled></select>
      </div>

      <div class="card summary" aria-live="polite">
        <div class="row"><span>ご予約日時</span><span id="sumWhen">—</span></div>
        <div class="row"><span>料金</span><span class="price" id="sumPrice">—</span></div>
      </div>

      <button id="submit" type="submit" disabled>予約する</button>
      <p id="error" role="alert"></p>
      <p class="notes">
        ・料金は30分750円です。<br>
        ・ご予約は2時間以上、30分単位でお選びいただけます。<br>
        ・ご予約の変更・キャンセルは、店舗までLINEでご連絡ください。
      </p>
    </form>
  </section>

  <section id="done" hidden>
    <div class="check">✓</div>
    <h1>ご予約が完了しました</h1>
    <p class="sub" id="doneNote">LINEにも予約完了のメッセージをお送りしました。</p>
    <div class="card summary">
      <div class="row"><span>お名前</span><span id="dName"></span></div>
      <div class="row"><span>ご予約日時</span><span id="dWhen"></span></div>
      <div class="row"><span>ご利用時間</span><span id="dDur"></span></div>
      <div class="row"><span>料金</span><span class="price" id="dPrice"></span></div>
    </div>
    <button id="closeBtn" type="button">閉じる</button>
  </section>
</main>

<script>
/* ========== 設定(ここを書き換えてください) ========== */
const LIFF_ID = '2012550908-7Jf6eJDh';                                   // 例: 2001234567-AbCdEfGh
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwASirTnz6TFPw-HTMmSaR0vID_MHc4hkIYmYugjzx_yb9slyP4LhBtjv9OpQ9xIGeu/exec';  // GASのウェブアプリURL

/* ========== 予約ルール(Code.gs の CFG と揃える) ========== */
const RULE = { startStep: 15, minDur: 120, durStep: 30, maxDur: 480, unit: 30, unitPrice: 750, maxDays: 60, leadMin: 0 };

const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, '0');
let busy = [];      // 予約済みの時間帯 [{s, e}](エポックms)
let ready = false;  // 空き状況を取得できているか
let needPhone = false; // 初回のお客様(電話番号の入力が必要)か

// 全角数字・ハイフン・空白を取り除き、0から始まる10〜11桁だけ通す(Code.gs の normalizePhone_ と同じ規則)
function normalizePhone(value) {
  let t = String(value || '')
    .replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[\s\-ー－‐−()（）]/g, '');
  if (t.indexOf('+81') === 0) t = '0' + t.slice(3);
  return /^0\d{9,10}$/.test(t) ? t : '';
}

function showPhoneBox(on) {
  needPhone = on;
  $('phoneBox').hidden = !on;
}

// 初回のお客様のときだけ電話番号の欄を表示する(確認できない場合も、安全のため表示する)
async function checkRegistered() {
  try {
    const idToken = liff.getIDToken();
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'me', idToken }),
    });
    const data = await res.json();
    showPhoneBox(data.ok ? !data.registered : true);
  } catch (e) {
    showPhoneBox(true);
  }
}

/* ---------- 日時ユーティリティ(端末のタイムゾーンに関係なくJSTで扱う) ---------- */
const jstNow = () => new Date(Date.now() + 9 * 3600 * 1000);
const ymd = (d) => d.toISOString().slice(0, 10);
const toMs = (date, time) => new Date(date + 'T' + time + ':00+09:00').getTime();
function fmtJst(ms) {
  const d = new Date(ms + 9 * 3600 * 1000);
  return { date: ymd(d), time: pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()), dow: '日月火水木金土'[d.getUTCDay()], y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate() };
}
const yen = (n) => n.toLocaleString('ja-JP') + '円';
const priceOf = (dur) => (dur / RULE.unit) * RULE.unitPrice;
const durLabel = (m) => Math.floor(m / 60) + '時間' + (m % 60 ? (m % 60) + '分' : '');

function rangeLabel(startMs, dur) {
  const s = fmtJst(startMs);
  const e = fmtJst(startMs + dur * 60000);
  let endText = e.time.replace(/^0/, '');
  if (e.date !== s.date) endText = e.time === '00:00' ? '24:00' : '翌' + endText;
  return s.y + '年' + s.m + '月' + s.d + '日(' + s.dow + ') ' + s.time.replace(/^0/, '') + '〜' + endText;
}

function isFree(startMs, dur) {
  if (startMs < Date.now() + RULE.leadMin * 60000) return false;
  const endMs = startMs + dur * 60000;
  return !busy.some((b) => startMs < b.e && endMs > b.s);
}

/* ---------- 画面の制御 ---------- */
function showError(msg) { $('error').textContent = msg || ''; }
function setLoading(on) {
  $('submit').disabled = on || !ready || !$('start').value;
  $('submit').textContent = on ? '確認中…' : '予約する';
}

function setupDate() {
  const today = jstNow();
  $('date').min = ymd(today);
  $('date').max = ymd(new Date(today.getTime() + RULE.maxDays * 86400000));
  $('date').value = ymd(today);
}

async function loadBusy() {
  const date = $('date').value;
  if (!date) return;
  ready = false;
  $('start').disabled = true;
  $('duration').disabled = true;
  setLoading(true);
  try {
    if (GAS_URL.indexOf('XXXX') !== -1) throw new Error('GAS_URL がまだ書き換えられていません(XXXX のままです)');
    let res;
    try {
      res = await fetch(GAS_URL + '?action=busy&date=' + encodeURIComponent(date));
    } catch (netErr) {
      throw new Error('GASに接続できません。GAS_URL が正しいか、GASの公開設定が「全員」になっているか確認してください');
    }
    const text = await res.text();
    let data;
    try {
      data = JSON.parse(text);
    } catch (parseErr) {
      throw new Error('GASから想定外の応答が返りました(HTTP ' + res.status + ')。公開設定が「全員」か、/exec のURLかを確認してください');
    }
    if (!data.ok) throw new Error('GASのエラー: ' + data.error);
    busy = data.busy;
    ready = true;
    showError('');
  } catch (e) {
    busy = [];
    showError('空き状況を取得できませんでした。\n原因: ' + e.message);
  }
  buildStarts();
  setLoading(false);
}

function buildStarts() {
  const date = $('date').value;
  const sel = $('start');
  const prev = sel.value;
  sel.innerHTML = '';
  const ph = document.createElement('option');
  ph.value = '';
  ph.textContent = '選択してください';
  sel.appendChild(ph);

  let anyFree = false;
  for (let m = 0; m < 1440; m += RULE.startStep) {
    const t = pad(Math.floor(m / 60)) + ':' + pad(m % 60);
    const ok = ready && isFree(toMs(date, t), RULE.minDur); // 最低時間が入らない開始時刻は選べない
    const o = document.createElement('option');
    o.value = t;
    o.textContent = ok ? t : t + '(予約不可)';
    o.disabled = !ok;
    if (ok) anyFree = true;
    sel.appendChild(o);
  }
  const prevOk = prev && Array.from(sel.options).some((o) => o.value === prev && !o.disabled);
  sel.value = prevOk ? prev : '';
  sel.disabled = !ready;
  if (ready && !anyFree) showError('この日は空きがありません。別の日をお選びください。');
  buildDurations();
}

function buildDurations() {
  const date = $('date').value;
  const t = $('start').value;
  const sel = $('duration');
  const prev = Number(sel.value) || RULE.minDur;
  sel.innerHTML = '';
  let firstOk = null;
  for (let d = RULE.minDur; d <= RULE.maxDur; d += RULE.durStep) {
    const ok = t ? isFree(toMs(date, t), d) : true;
    const o = document.createElement('option');
    o.value = String(d);
    o.textContent = durLabel(d) + '(' + yen(priceOf(d)) + ')' + (ok ? '' : ' 予約不可');
    o.disabled = !ok;
    if (ok && firstOk === null) firstOk = d;
    sel.appendChild(o);
  }
  const prevOk = Array.from(sel.options).some((o) => Number(o.value) === prev && !o.disabled);
  sel.value = String(prevOk ? prev : firstOk === null ? RULE.minDur : firstOk);
  sel.disabled = !ready || !t;
  updateSummary();
}

function updateSummary() {
  const date = $('date').value;
  const t = $('start').value;
  const dur = Number($('duration').value);
  if (t && dur) {
    $('sumWhen').textContent = rangeLabel(toMs(date, t), dur);
    $('sumPrice').textContent = yen(priceOf(dur));
  } else {
    $('sumWhen').textContent = '—';
    $('sumPrice').textContent = '—';
  }
  $('submit').disabled = !ready || !t;
}

function showDone(data) {
  const s = data.summary;
  $('dName').textContent = s.name + ' 様';
  $('dWhen').textContent = s.when;
  $('dDur').textContent = s.duration;
  $('dPrice').textContent = s.price;
  if (!data.notified) {
    $('doneNote').textContent = 'LINEへの通知を送れませんでしたが、ご予約は完了しています。この画面を保存してください。';
  }
  $('formView').hidden = true;
  $('done').hidden = false;
  window.scrollTo(0, 0);
}

/* ---------- イベント ---------- */
$('date').addEventListener('change', loadBusy);
$('start').addEventListener('change', buildDurations);
$('duration').addEventListener('change', updateSummary);
$('closeBtn').addEventListener('click', () => {
  if (liff.isInClient()) liff.closeWindow(); else window.close();
});

$('form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  showError('');
  const name = $('name').value.trim();
  const date = $('date').value;
  const t = $('start').value;
  const dur = Number($('duration').value);
  if (!name) return showError('お名前を入力してください。');
  let phone = '';
  if (needPhone) {
    phone = normalizePhone($('phone').value);
    if (!phone) return showError('お電話番号を正しく入力してください(例:090-1234-5678)。');
  }
  if (!date || !t) return showError('日付と開始時刻を選択してください。');

  setLoading(true);
  try {
    const idToken = liff.getIDToken();
    if (!idToken) throw new Error('LINEの認証情報を取得できませんでした。LINEアプリから開き直してください。');
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // プリフライトを避けるためtext/plain
      body: JSON.stringify({ idToken, name, phone, start: date + 'T' + t + ':00+09:00', durationMin: dur }),
    });
    const data = await res.json();
    if (!data.ok) {
      if (data.needPhone) showPhoneBox(true);
      await loadBusy(); // 最新の空き状況に更新
      showError(data.error); // 更新で消えないよう、更新のあとに表示する
      return;
    }
    showDone(data);
  } catch (e) {
    showError(e.message || '通信に失敗しました。もう一度お試しください。');
  } finally {
    setLoading(false);
  }
});

/* ---------- 起動 ---------- */
(async function main() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
  } catch (e) {
    showError('LINEの初期化に失敗しました。LINEアプリから開き直してください。');
    return;
  }
  setupDate();
  buildStarts();
  await Promise.all([loadBusy(), checkRegistered()]);
})();
</script>
</body>
</html>
